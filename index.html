<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Task Attendance Dashboard — V.1</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--text:#173238;--muted:#6b7d82;--primary:#087f8c;--primary2:#0aa1a0;--danger:#c0392b;--line:#e1e9eb;--shadow:0 8px 28px rgba(24,55,61,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eaf7f6,#f8fbfb)}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.brand{font-weight:800;font-size:23px;letter-spacing:-.4px}.sub{color:var(--muted);margin:7px 0 22px}
.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#4b6268}
.field input{width:100%;padding:13px;border:1px solid #cddadd;border-radius:11px;outline:none}.field input:focus{border-color:var(--primary)}
.btn{padding:12px 16px;border-radius:11px;background:#edf3f4;color:var(--text);font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.danger{background:#fff0ef;color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.userbox{display:flex;gap:12px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#dff4f2;display:grid;place-items:center;font-weight:800;color:var(--primary)}
.container{max-width:1180px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(24,55,61,.04)}
.kpi{font-size:25px;font-weight:800;margin-top:7px}.label{font-size:12px;color:var(--muted);font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.attendance{margin-top:14px}.time{font-size:18px;font-weight:800}.status{display:inline-flex;padding:6px 9px;border-radius:999px;background:#edf7f6;color:#087f8c;font-size:12px;font-weight:800}.msg{padding:10px 12px;border-radius:10px;background:#fff8e6;color:#795b00;margin:12px 0;font-size:13px}.error{background:#fff0ef;color:#a22}.success{background:#edf8f1;color:#19723c}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f8fbfb;color:#51666b;position:sticky;top:0}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #c9dfe0;border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section-title h2{font-size:16px;margin:0}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.container{padding:14px}.topbar{padding:0 12px}.brand{font-size:17px}.card{padding:14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.actions .btn{flex:1 1 44%}.login-card{padding:22px}.topbar{height:58px}.userbox .meta{display:none}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand">Task Attendance Dashboard</div>
    <div class="sub">Fast Attendance • V.1</div>
    <div id="loginMsg"></div>
    <div class="field"><label>Username</label><input id="username" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn primary" style="width:100%" onclick="login()">Sign In</button>
    <div class="small" style="margin-top:14px">Lightweight mode: heavy reports are not loaded during login.</div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="topbar">
    <div class="brand">Task Attendance</div>
    <div class="userbox">
      <div class="avatar" id="avatar">U</div>
      <div class="meta"><b id="displayName">User</b><div class="small" id="roleDept"></div></div>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <main class="container">
    <div id="pageMsg"></div>
    <div class="card">
      <div class="section-title" style="margin-top:0"><h2>Today Attendance</h2><span class="status" id="todayStatus">Loading</span></div>
      <div class="small" id="dateLabel"></div>
      <div id="blockMsg"></div>
      <div class="grid attendance">
        <div><div class="label">Punch In</div><div class="time" id="inTime">—</div></div>
        <div><div class="label">Punch Out</div><div class="time" id="outTime">—</div></div>
        <div><div class="label">Breaks Used</div><div class="time" id="breaksUsed">0 / 3</div></div>
        <div><div class="label">Approval</div><div class="time" id="approval">Pending</div></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="punchInBtn" onclick="run('punchIn')">Punch In</button>
        <button class="btn" id="breakStartBtn" onclick="run('breakStart')">Break Start</button>
        <button class="btn" id="breakEndBtn" onclick="run('breakEnd')">Break End</button>
        <button class="btn danger" id="punchOutBtn" onclick="run('punchOut')">Punch Out</button>
      </div>
    </div>

    <div class="section-title"><h2>Attendance History</h2><button class="btn" onclick="loadHistory()">Refresh</button></div>
    <div class="card">
      <div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Break 1</th><th>Break 2</th><th>Break 3</th><th>Status</th></tr></thead><tbody id="historyBody"><tr><td colspan="7">Loading…</td></tr></tbody></table></div>
    </div>
  </main>
</div>

<script>
const CONFIG={API_URL:'PASTE_APPS_SCRIPT_WEB_APP_URL_HERE',VERSION:'V.1'};
let token=sessionStorage.getItem('ta_token')||'';
let currentUser=null;
let attendance=null;

function api(action,data={}){
  return fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...data})})
    .then(r=>r.json()).catch(()=>({status:'error',message:'Network error. Internet connection check kijiye.'}));
}
function show(el,msg,type=''){
  const e=document.getElementById(el);
  if(!msg){e.innerHTML='';return}
  e.innerHTML='<div class="msg '+type+'">'+escapeHtml(msg)+'</div>';
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setBusy(btn,busy,label){
  btn.disabled=busy;btn.innerHTML=busy?'<span class="spinner"></span> '+label:label;
}
async function login(){
  const btn=document.getElementById('loginBtn'); setBusy(btn,true,'Signing in…'); show('loginMsg','');
  const r=await api('login',{username:username.value,password:password.value});
  setBusy(btn,false,'Sign In');
  if(r.status!=='success'){show('loginMsg',r.message,'error');return}
  token=r.token;sessionStorage.setItem('ta_token',token);currentUser=r.user;
  document.getElementById('loginView').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  displayName.textContent=currentUser.displayName||currentUser.username;
  roleDept.textContent=[currentUser.role,currentUser.department,currentUser.employeeId].filter(Boolean).join(' • ');
  avatar.textContent=(currentUser.displayName||'U').slice(0,1).toUpperCase();
  await loadState(); loadHistory();
}
async function loadState(){
  const r=await api('getAttendanceState');
  if(r.status==='error'){if(r.code==='AUTH') return forceLogout(); show('pageMsg',r.message,'error');return}
  attendance=r.attendance; dateLabel.textContent='Date: '+r.today+' • '+new Date(r.serverTime).toLocaleTimeString();
  renderAttendance(r);
}
function renderAttendance(r){
  const a=r.attendance||{}; inTime.textContent=a.inTime||'—';outTime.textContent=a.outTime||'—';
  const breaks=[a.break1Start&&a.break1End,a.break2Start&&a.break2End,a.break3Start&&a.break3End].filter(Boolean).length;
  breaksUsed.textContent=breaks+' / 3';approval.textContent=a.approvalStatus||'Pending';
  const openBreak=(a.break1Start&&!a.break1End)||(a.break2Start&&!a.break2End)||(a.break3Start&&!a.break3End);
  const blocked=!!r.blocked;
  todayStatus.textContent=blocked?'Blocked':(a.inTime?'Active':'Not Started');
  if(blocked) show('blockMsg',r.blockReason,'');
  else show('blockMsg','');
  punchInBtn.disabled=blocked||!!a.inTime;
  breakStartBtn.disabled=blocked||!a.inTime||!!a.outTime||openBreak||breaks>=3;
  breakEndBtn.disabled=blocked||!openBreak;
  punchOutBtn.disabled=blocked||!a.inTime||!!a.outTime||openBreak;
}
async function run(action){
  const btn=document.getElementById(action==='punchIn'?'punchInBtn':action==='punchOut'?'punchOutBtn':action==='breakStart'?'breakStartBtn':'breakEndBtn');
  const label=btn.textContent;setBusy(btn,true,'Processing…');show('pageMsg','');
  const r=await api(action);
  setBusy(btn,false,label);
  if(r.status!=='success'){if(r.code==='AUTH')return forceLogout();show('pageMsg',r.message,'error');return}
  renderAttendance(r);show('pageMsg','Attendance updated successfully.','success');loadHistory();
}
async function loadHistory(){
  const r=await api('getAttendanceHistory',{from:dateRange(-30),to:dateRange(0)});
  if(r.status!=='success'){if(r.code==='AUTH')return forceLogout();historyBody.innerHTML='<tr><td colspan="7">'+escapeHtml(r.message)+'</td></tr>';return}
  if(!r.rows.length){historyBody.innerHTML='<tr><td colspan="7">No attendance found.</td></tr>';return}
  historyBody.innerHTML=r.rows.map(x=>'<tr><td>'+escapeHtml(x.date)+'</td><td>'+escapeHtml(x.inTime||'—')+'</td><td>'+escapeHtml(x.outTime||'—')+'</td><td>'+escapeHtml((x.break1Start||'—')+' → '+(x.break1End||'—'))+'</td><td>'+escapeHtml((x.break2Start||'—')+' → '+(x.break2End||'—'))+'</td><td>'+escapeHtml((x.break3Start||'—')+' → '+(x.break3End||'—'))+'</td><td>'+escapeHtml(x.approvalStatus||'')+'</td></tr>').join('');
}
function dateRange(offset){
 const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10);
}
function logout(){api('logout').finally(forceLogout)}
function forceLogout(){sessionStorage.removeItem('ta_token');token='';location.reload()}
if(token){document.getElementById('loginView').classList.add('hidden');document.getElementById('app').classList.remove('hidden');api('getAttendanceState').then(r=>{if(r.status==='success'){currentUser=r.user;displayName.textContent=currentUser.displayName||currentUser.username;roleDept.textContent=[currentUser.role,currentUser.department,currentUser.employeeId].filter(Boolean).join(' • ');avatar.textContent=(currentUser.displayName||'U').slice(0,1).toUpperCase();renderAttendance(r);loadHistory()}else forceLogout()})}
</script>
</body>
</html>
