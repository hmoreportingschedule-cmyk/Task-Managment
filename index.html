<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Managment</title><style>
:root{--p:#0f766e;--p2:#115e59;--bg:#f4f7f7;--card:#fff;--text:#16302d;--muted:#6b7d7a;--danger:#b42318;--border:#dbe5e3}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--p);color:white}button.secondary{background:#e6efed;color:var(--p2)}button.danger{background:var(--danger)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e9f7f4,#f8fbfb)}.loginbox{width:min(420px,100%);background:white;padding:30px;border-radius:20px;box-shadow:0 12px 45px #0b3b3718}.logo{font-size:28px;font-weight:800;color:var(--p2);margin-bottom:6px}.muted{color:var(--muted);font-size:13px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;background:#fff}.app{display:flex;min-height:100vh}.side{width:250px;background:#0c3431;color:#e9fffb;padding:20px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;margin-bottom:22px}.nav button{width:100%;text-align:left;background:transparent;margin:3px 0;color:#d8eeeb}.nav button.active,.nav button:hover{background:#ffffff14}.main{flex:1;padding:20px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px}.metric{font-size:25px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tablewrap{overflow:auto;background:white;border:1px solid var(--border);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px;border-bottom:1px solid #edf1f0;text-align:left;font-size:13px}.table th{background:#f8fbfa}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.modal{position:fixed;inset:0;background:#001d1b66;display:grid;place-items:center;padding:20px;z-index:5}.modalbox{background:white;border-radius:18px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:18px;bottom:18px;background:#123d39;color:white;padding:12px 16px;border-radius:10px;z-index:9}.profile{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#dcebea}.section{display:none}.section.active{display:block}@media(max-width:900px){.side{width:72px;padding:10px}.brand{font-size:0}.brand:after{content:'TM';font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:20px}.main{padding:12px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.app{display:block}.side{height:auto;width:100%;display:flex;align-items:center;gap:10px;position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;font-size:12px}.nav button:before{display:none}.cards{grid-template-columns:1fr 1fr}.top h2{font-size:18px}}
</style></head><body><div id="root"></div><script>
const state={token:localStorage.tmToken||'',user:null,data:null,section:'dashboard'};
const $=s=>document.querySelector(s); const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function gas(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...args))}
async function api(action,p={}){try{return await gas('api',state.token,action,p)}catch(e){if(/Session expired/.test(e.message)){logout();}throw e}}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function loginView(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">Task Managment</div><div class="muted">Employee • HOD • Admin Task & Attendance</div><div class="field"><label>User ID</label><input id="uid" autocomplete="username"></div><div class="field"><label>Password</label><input id="pwd" type="password" autocomplete="current-password"></div><button style="width:100%" onclick="doLogin()">Login</button><p class="muted">First setup: run setupSystem() in Apps Script. Bootstrap admin: admin / ChangeMe@123</p></div></div>`}
async function doLogin(){try{const r=await gas('login',$('#uid').value,$('#pwd').value);state.token=r.token;state.user=r.user;localStorage.tmToken=r.token;await load();}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem('tmToken');state.token='';state.user=null;loginView()}
async function load(){try{state.data=await api('bootstrap');state.user=state.data.user;renderApp();}catch(e){toast(e.message)}}
function navItems(){const a=[['dashboard','Dashboard'],['tasks','My Tasks'],['attendance','Attendance'],['requests','Requests'],['reports','Reports'],['notifications','Notifications'],['profile','Profile']];if(state.user.role==='ADMIN')a.splice(1,0,['employees','Employees'],['templates','Templates']);return a}
function renderApp(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand">Task Managment</div><div class="nav">${navItems().map(x=>`<button class="${state.section===x[0]?'active':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="logout()">Logout</button></div></aside><main class="main"><div class="top"><div><h2 id="title">Dashboard</h2><div class="muted">${esc(state.user.Name)} • ${esc(state.user.Role)}</div></div><div class="profile"><img class="avatar" src="${esc(state.user.PhotoUrl||'')}" onerror="this.style.display='none'"><span>🔔 ${state.data.notifications.filter(x=>x.Read!=='YES').length}</span></div></div><div id="content"></div></main></div>`;show(state.section)}
function show(s){state.section=s;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const i=navItems().findIndex(x=>x[0]===s);if(document.querySelectorAll('.nav button')[i])document.querySelectorAll('.nav button')[i].classList.add('active');$('#title').textContent=(navItems().find(x=>x[0]===s)||['','Dashboard'])[1];renderSection()}
function renderSection(){const c=$('#content');if(state.section==='dashboard')return dashboard(c);if(state.section==='tasks')return tasks(c);if(state.section==='employees')return employees(c);if(state.section==='templates')return templates(c);if(state.section==='attendance')return attendance(c);if(state.section==='requests')return requests(c);if(state.section==='reports')return reports(c);if(state.section==='notifications')return notifications(c);if(state.section==='profile')return profile(c)}
function dashboard(c){const m=state.data.metrics;c.innerHTML=`<div class="cards">${[['Tasks',m.tasks],['Completed',m.completed],['Pending',m.pending],['Delayed',m.delayed],['Approval Pending',m.attendancePending+m.requestsPending]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><br><div class="grid"><div class="card"><b>Recent Tasks</b><div class="tablewrap" style="margin-top:12px">${miniTasks(state.data.tasks)}</div></div><div class="card"><b>Notifications</b><div style="margin-top:12px">${state.data.notifications.slice(0,6).map(n=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${esc(n.Title)}</b><div class="muted">${esc(n.Message)}</div></div>`).join('')||'<div class="muted">No notifications</div>'}</div></div></div>`}
function miniTasks(a){return `<table class="table"><thead><tr><th>Task</th><th>Status</th><th>Due</th></tr></thead><tbody>${a.slice(0,8).map(t=>`<tr><td>${esc(t.Title)}</td><td>${esc(t.Status)}</td><td>${fmt(t.DueDate)}</td></tr>`).join('')}</tbody></table>`}
async function tasks(c){let a=state.data.tasks;c.innerHTML=`<div class="toolbar">${['PENDING','IN_PROGRESS','COMPLETED','DELAYED'].map(x=>`<button class="secondary" onclick="filterTasks('${x}')">${x}</button>`).join('')}</div><div class="tablewrap">${taskTable(a)}</div>`}
function taskTable(a){return `<table class="table"><thead><tr><th>Task</th><th>Priority</th><th>Due</th><th>Minutes</th><th>Status</th><th>Action</th></tr></thead><tbody>${a.map(t=>`<tr><td><b>${esc(t.Title)}</b><div class="muted">${esc(t.Details)}</div></td><td>${esc(t.Priority)}</td><td>${fmt(t.DueDate)}</td><td>${t.ActualMinutes||0}</td><td>${esc(t.Status)}</td><td>${['COMPLETED','CANCELLED'].includes(t.Status)?'—':`<button onclick="completeTask('${esc(t.TaskId)}')">Complete</button>`}</td></tr>`).join('')}</tbody></table>`}
async function filterTasks(st){const a=await api('tasks.list',{status:st});$('#content').innerHTML=`<div class="tablewrap">${taskTable(a)}</div>`}
async function completeTask(id){const mins=prompt('Task mein kitne minutes lage?','30');if(mins===null)return;try{await api('tasks.complete',{taskId:id,actualMinutes:Number(mins),completedAt:new Date().toISOString()});toast('Task updated');await load();show('tasks')}catch(e){toast(e.message)}}
async function employees(c){const a=await api('users.list');c.innerHTML=`<div class="toolbar"><button onclick="userModal()">+ Add Employee</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Employee ID</th><th>User ID</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${a.map(u=>`<tr><td>${esc(u.Name)}</td><td>${esc(u.EmployeeId)}</td><td>${esc(u.UserId)}</td><td>${esc(u.Role)}</td><td>${esc(u.Status)}</td><td><button class="secondary" onclick='userModal(${JSON.stringify(u)})'>Edit</button> <button class="danger" onclick="toggleUser('${esc(u.UserId)}','${esc(u.Status)}')">${u.Status==='ACTIVE'?'Deactive':'Active'}</button></td></tr>`).join('')}</tbody></table></div>`}
function userModal(u={}){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>${u.UserId?'Edit':'Create'} Employee</h3><div class="grid">${field('Name','name',u.Name)}${field('Employee ID','employeeId',u.EmployeeId)}${field('User ID','userId',u.UserId)}${field('Password','password','')} ${field('Contact','contact',u.Contact)}${field('Profile Photo URL','photoUrl',u.PhotoUrl)}${field('Office In','officeIn',u.OfficeIn||'09:00')} ${field('Office Out','officeOut',u.OfficeOut||'18:00')} ${field('Weekoff','weekoff',u.Weekoff||'Sunday')} ${field('City','city',u.City)}${field('Department','department',u.Department)}${field('Designation','designation',u.Designation)}${field('HOD User ID','hodUserId',u.HODUserId)}</div><div class="field"><label>Office Address</label><textarea id="officeAddress">${esc(u.OfficeAddress||'')}</textarea></div><div class="toolbar"><button onclick="saveUser('${esc(u.UserId||'')}')">Save</button><button class="secondary" onclick="this.closest('.modal').remove()">Cancel</button></div></div>`;document.body.appendChild(m)}
function field(label,id,val){return `<div class="field"><label>${label}</label><input id="${id}" value="${esc(val||'')}"></div>`}
async function saveUser(old){const p={};['name','employeeId','userId','password','contact','photoUrl','officeIn','officeOut','weekoff','city','department','designation','hodUserId'].forEach(k=>p[k]=$('#'+k).value);p.officeAddress=$('#officeAddress').value;p.role='EMPLOYEE';if(old)p.oldUserId=old;try{await api('users.save',p);document.querySelector('.modal').remove();toast('Employee saved');await load();show('employees')}catch(e){toast(e.message)}}
async function toggleUser(id,status){try{await api(status==='ACTIVE'?'users.delete':'users.activate',{userId:id});await load();show('employees')}catch(e){toast(e.message)}}
async function templates(c){const a=await api('templates.list');c.innerHTML=`<div class="toolbar"><button onclick="templateModal()">+ Create Template</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Template</th><th>Priority</th><th>Frequency</th><th>Month</th><th>Action</th></tr></thead><tbody>${a.map(t=>`<tr><td>${esc(t.Title)}</td><td>${esc(t.Priority)}</td><td>${esc(t.Frequency)}</td><td>${esc(t.MonthKey)}</td><td><button class="danger" onclick="deleteTemplate('${t.TemplateId}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function templateModal(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>Create Task Template</h3>${field('Title','ttitle','')}${field('Details','tdetails','')}${field('Category','tcat','General')}${field('Priority','tpri','Medium')}${field('Estimated Minutes','tmins','30')}${field('Frequency','tfreq','ONE_TIME')}<div class="toolbar"><button onclick="saveTemplate()">Save</button><button class="secondary" onclick="this.closest('.modal').remove()">Cancel</button></div></div>`;document.body.appendChild(m)}
async function saveTemplate(){try{await api('templates.save',{title:$('#ttitle').value,details:$('#tdetails').value,category:$('#tcat').value,priority:$('#tpri').value,estimatedMinutes:Number($('#tmins').value),frequency:$('#tfreq').value});document.querySelector('.modal').remove();toast('Template created');renderSection()}catch(e){toast(e.message)}}
async function deleteTemplate(id){if(!confirm('Delete template?'))return;await api('templates.delete',{templateId:id});renderSection()}
function attendance(c){const a=state.data.attendance;c.innerHTML=`<div class="toolbar"><button onclick="loadAttendance()">Refresh</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Break</th><th>Office Minutes</th><th>Approval</th></tr></thead><tbody>${a.map(x=>`<tr><td>${fmt(x.Date)}</td><td>${esc(x.EmployeeName)}</td><td>${esc(x.InTime)}</td><td>${esc(x.OutTime)}</td><td>${x.BreakMinutes||0}</td><td>${x.OfficeMinutes||0}</td><td>${esc(x.ApprovalStatus)}</td></tr>`).join('')}</tbody></table></div>`}
async function loadAttendance(){state.data.attendance=await api('attendance.list',{});attendance($('#content'))}
function requests(c){const a=state.data.requests;c.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Type</th><th>Employee</th><th>Details</th><th>Status</th><th>Action</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.Type)}</td><td>${esc(x.EmployeeName)}</td><td>${esc(x.Details)}</td><td>${esc(x.Status)}</td><td>${x.Status==='PENDING'&&state.user.role!=='EMPLOYEE'?`<button onclick="approveReq('${x.RequestId}','APPROVED')">Approve</button> <button class="danger" onclick="approveReq('${x.RequestId}','REJECTED')">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
async function approveReq(id,status){await api('requests.approve',{requestId:id,status});await load();show('requests')}
async function reports(c){const r=await api('reports',{});c.innerHTML=`<div class="cards"><div class="card"><div class="muted">Task Count</div><div class="metric">${r.taskCount}</div></div><div class="card"><div class="muted">Completed</div><div class="metric">${r.completed}</div></div><div class="card"><div class="muted">Delayed</div><div class="metric">${r.delayed}</div></div><div class="card"><div class="muted">Office Minutes</div><div class="metric">${r.attendanceMinutes}</div></div></div><br><div class="card"><b>Monthly Task Minutes</b>${Object.entries(r.taskMinutesByMonth).map(([k,v])=>`<div style="padding:10px 0;border-bottom:1px solid #eee">${esc(k)} <b style="float:right">${v} min</b></div>`).join('')||'<p class="muted">No task data</p>'}</div>`}
function notifications(c){c.innerHTML=`<div class="card">${state.data.notifications.map(n=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><b>${esc(n.Title)}</b><div>${esc(n.Message)}</div><small class="muted">${fmt(n.CreatedAt)}</small></div>`).join('')||'<div class="muted">No notifications</div>'}</div>`}
function profile(c){c.innerHTML=`<div class="card" style="max-width:600px">${field('Contact Number','pc',state.user.Contact)}${field('New Password','pp','')}<button onclick="saveProfile()">Save Profile</button></div>`}
async function saveProfile(){try{const u=await api('users.profile',{contact:$('#pc').value,password:$('#pp').value});state.user=u;toast('Profile updated')}catch(e){toast(e.message)}}
function fmt(x){if(!x)return'—';const d=new Date(x);return isNaN(d)?String(x):d.toLocaleDateString()}
if(state.token){load()}else loginView();
</script></body></html>
